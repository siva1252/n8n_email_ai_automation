{% extends 'deals/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white border border-slate-200 rounded-xl p-8">
    <h1 class="text-2xl font-semibold mb-1">Sign in</h1>
    <p class="text-sm text-slate-500 mb-6">Creator deal dashboard</p>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label class="block text-sm font-medium mb-1">Username</label>
        <input name="username" required class="w-full mb-4 px-3 py-2 border border-slate-300 rounded-md">
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" required class="w-full mb-6 px-3 py-2 border border-slate-300 rounded-md">
        <button class="w-full bg-slate-900 text-white py-2.5 rounded-md hover:bg-slate-800">Login</button>
    </form>
</div>
{% endblock %}
